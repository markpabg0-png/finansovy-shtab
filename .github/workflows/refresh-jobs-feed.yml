name: Refresh freelance jobs feed
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-jobs-feed
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch public RSS feeds and filter relevant jobs
        run: python scripts/update_jobs_feed.py
      - name: Commit feed when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-feed.json
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "Refresh freelance jobs feed"
            git push
          fi
